name: ORACLE CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DOCKER_IMAGE: "oracle-viral-evolution"

jobs:
  # ─── Lint & Format ───
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd oracle
          pip install -r requirements.txt
          pip install flake8 black isort

      - name: Run flake8
        run: |
          cd oracle
          flake8 src/ --max-line-length=120 --ignore=E501,W503

      - name: Check formatting (black)
        run: |
          cd oracle
          black --check src/ dashboard/

      - name: Check imports (isort)
        run: |
          cd oracle
          isort --check-only src/

  # ─── Unit Tests ───
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd oracle
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          cd oracle
          python -m pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: oracle/coverage.xml

  # ─── Integration Test (Pipeline) ───
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd oracle
          pip install -r requirements.txt

      - name: Run pipeline (small)
        run: |
          cd oracle
          python -m src.agents.orchestrator 50

  # ─── Docker Build ───
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          cd oracle
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} .
          docker tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ${{ env.DOCKER_IMAGE }}:latest

      - name: Test Docker image
        run: |
          docker run --rm ${{ env.DOCKER_IMAGE }}:latest python -c "from src.agents.orchestrator import OracleOrchestrator; print('OK')"
